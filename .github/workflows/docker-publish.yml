name: Build and publish container

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve lowercase image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "app=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
          echo "ffmpeg=ghcr.io/${repository}-ffmpeg:8.1.2-svt4.2.0-vmaf3.1.0" >> "$GITHUB_OUTPUT"

      - name: Generate application image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish FFmpeg base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ffmpeg-svtav1
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.ffmpeg }}
          cache-from: type=gha,scope=ffmpeg
          cache-to: type=gha,mode=max,scope=ffmpeg

      - name: Build and publish application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FFMPEG_IMAGE=${{ steps.images.outputs.ffmpeg }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application
          provenance: true
          sbom: true
