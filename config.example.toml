# Configurazione di av1webconverter.
#
# Copiare in `config.toml` e adattare. Ogni voce ha un default: le sezioni
# omesse restano ai valori qui indicati come commento. Tutte le voci principali
# sono sovrascrivibili da variabili d'ambiente (prefisso AV1WC_), utili per
# configurare il container senza montare un file.

[server]
bind = "0.0.0.0"            # AV1WC_BIND
port = 8080                 # AV1WC_PORT
max_upload_mb = 8192        # AV1WC_MAX_UPLOAD_MB — limite per singola richiesta

[auth]
# Basic auth su frontend e API. `/healthz` resta sempre accessibile.
enabled = true              # AV1WC_AUTH_ENABLED
username = "admin"          # AV1WC_AUTH_USERNAME
password = "changeme"       # AV1WC_AUTH_PASSWORD — cambiare prima di esporre il servizio

[paths]
input_dir = "in"            # AV1WC_INPUT_DIR — file caricati, una cartella per job
output_dir = "out"          # AV1WC_OUTPUT_DIR — file convertiti, una cartella per job
data_dir = "data"           # AV1WC_DATA_DIR — stato dei job e file temporanei
log_dir = "logs"            # AV1WC_LOG_DIR — log applicativi e log di conversione

[ffmpeg]
# Binari della build custom con SVT-AV1 (vedi Dockerfile.ffmpeg-svtav1).
ffmpeg_bin = "ffmpeg"       # AV1WC_FFMPEG_BIN
ffprobe_bin = "ffprobe"     # AV1WC_FFPROBE_BIN

[jobs]
# Conversioni simultanee dentro un singolo job. 1 = i file vengono convertiti
# in sequenza, il prossimo parte al termine del precedente. Il valore è il
# default proposto ai nuovi job ed è modificabile dal frontend job per job.
default_concurrency = 1     # AV1WC_DEFAULT_CONCURRENCY
# Oggi si gestisce MP4; la lista è già predisposta per altri contenitori.
allowed_extensions = ["mp4", "mov", "mkv", "avi", "webm", "m4v", "ts", "mpg", "mpeg", "wmv"]
# Righe di log per file tenute in memoria per la vista live (su disco restano tutte).
log_buffer_lines = 500

[slack]
# Notifiche di terminazione ed errore via Incoming Webhook.
enabled = false                     # AV1WC_SLACK_ENABLED
webhook_url = ""                    # AV1WC_SLACK_WEBHOOK_URL (impostarlo abilita le notifiche)
notify_on_job_completed = true
notify_on_job_failed = true
notify_on_file_failed = true

[logging]
# Filtro tracing: "info", oppure per modulo "av1webconverter=debug,tower_http=info".
# La variabile AV1WC_LOG ha la precedenza su questo valore.
level = "info"              # AV1WC_LOG_LEVEL
# Log strutturati JSON in log_dir/av1webconverter.jsonl (rotazione giornaliera),
# oltre al log leggibile su stdout.
json_file = true

[encoding]
# Parametri di conversione proposti a ogni nuovo job. Il frontend può
# sovrascriverli per singolo job.

# "crf" = qualità costante, bitrate variabile.
# "target_size" = dimensione finale desiderata, VBR a due passaggi.
# "vmaf_analysis" = analisi VMAF preliminare e qualità costante.
mode = "crf"

scale_height = 480          # AV1WC_SCALE_HEIGHT — altezza massima, aspetto mantenuto, SAR 1:1; 0 = dimensione originale
crf = 47                    # AV1WC_CRF — solo in modalità crf
preset = 1                  # AV1WC_PRESET — 0 lentissimo/migliore, 13 velocissimo
audio_bitrate = "48k"       # AV1WC_AUDIO_BITRATE — per traccia Opus, ridotta a stereo

# tune=5 è ottimizzato per la qualità percettiva VMAF ed è il default.
# Richiede SVT-AV1 4.x (quello dell'immagine custom) ed è accettato solo in CRF:
# in modalità target_size viene forzato automaticamente tune=0.
svtav1_params = "tune=5"    # AV1WC_SVTAV1_PARAMS

pixel_format = "yuv420p10le"
# Distanza fra keyframe in secondi: -g = round(fps × valore), quindi 600 frame
# a 60 fps e 240 a 23.976. 0 usa keyint; keyint vale anche se il frame rate
# del sorgente non è rilevabile.
keyint_seconds = 10.0       # AV1WC_KEYINT_SECONDS
keyint = 240                # distanza fissa fra keyframe in frame (-g)
# cpus = 4                  # thread concessi a ffmpeg; se omesso decide ffmpeg
progress_interval = 5.0     # AV1WC_PROGRESS_INTERVAL — aggiornamento del progresso, in secondi
# Aggiunto al nome dell'output prima di .mp4; il frontend può cambiarlo per job.
suffix = "_av1"

# Solo in modalità target_size:
# target_size_mb = 300.0    # dimensione finale desiderata
size_margin_percent = 1.0   # quota del target riservata all'overhead MP4

# Se false, un output già presente viene saltato invece che riscritto.
overwrite = false

# Se true, misura il VMAF dell'output definitivo rispetto al sorgente con un
# passaggio ffmpeg aggiuntivo. La misura non modifica l'output.
measure_vmaf = false          # AV1WC_MEASURE_VMAF
# Modello VMAF built-in usato per la misura. Dai 45 fps in su un modello v1
# passa da solo alla variante _hfr_ (es. vmaf_v1.0.16_hfr_5d0h).
vmaf_model = "vmaf_v1.0.16_5d0h"  # AV1WC_VMAF_MODEL

# Solo in modalità vmaf_analysis: numero di spezzoni casuali.
vmaf_segments = 3                  # AV1WC_VMAF_SEGMENTS — da 1 a 10
# Solo in modalità vmaf_analysis: CRF aggiuntivi provati a passi di 2.
crf_test_steps = 3                 # AV1WC_CRF_TEST_STEPS — da 1 a 10
# Solo in modalità vmaf_analysis: VMAF medio minimo richiesto.
vmaf_target = 93.0                 # AV1WC_VMAF_TARGET — da 0 a 100
vmaf_segment_duration_seconds = 30.0 # AV1WC_VMAF_SEGMENT_DURATION_SECONDS — da 1 a 300
